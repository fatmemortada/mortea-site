<!DOCTYPE html>
<html>
<head>
  <title>Notification Settings | Mortéa</title>
</head>
<body>
  <h1>Notification Settings</h1>

  <form id="notification-settings-form">
    <label>
      <input type="checkbox" name="booking_confirmations" checked>
      Booking confirmations
    </label>

    <label>
      <input type="checkbox" name="booking_reminders" checked>
      Booking reminders
    </label>

    <label>
      <input type="checkbox" name="message_alerts" checked>
      Message alerts
    </label>

    <label>
      <input type="checkbox" name="review_requests" checked>
      Review requests
    </label>

    <button type="submit">Save Preferences</button>
  </form>
</body>
</html>
