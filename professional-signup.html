
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortéa — Professional Access</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="form-page">
  <div class="form-container">
    <p class="eyebrow">Professional Access</p>
    <h1>Build your luxury profile on Mortéa.</h1>

    <div class="form-note">Apply as a founding professional and prepare your future Mortéa profile.</div>
<form class="luxury-form">

      <input type="text" placeholder="Full Name">
      <input type="text" placeholder="Business Name">
      <input type="email" placeholder="Email Address">
      <input type="tel" placeholder="Phone Number">

      <select>
        <option>Choose Category</option>
        <option>Hair Salon</option>
        <option>Nail Studio</option>
        <option>Massage Center</option>
        <option>Head Spa</option>
        <option>Mobile Beauty Professional</option>
      </select>

      <select>
        <option>Choose Country</option>
        <option>Canada</option>
        <option>United States</option>
        <option>France</option>
      </select>

      <select>
        <option>Choose Province / State</option>
        <option>Québec</option>
        <option>Ontario</option>
      </select>

      <select>
        <option>Choose City</option>
        <option>Montréal</option>
        <option>Laval</option>
      </select>

      <input type="text" placeholder="Business Address">
      <input type="text" placeholder="Instagram Link">
      <input type="text" placeholder="TikTok Link">
      <input type="text" placeholder="WhatsApp Link">

      <textarea placeholder="Services Offered"></textarea>

      <select>
        <option>Choose Membership</option>
        <option>Founder Access — $9/month</option>
        <option>Studio Partner — $29/month</option>
      </select>

      <button type="submit">Continue to Payment</button>
    </form>
  </div>
</div>

</body>
</html>
