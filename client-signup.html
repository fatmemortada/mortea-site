
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortéa — Client Access</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="form-page">
  <div class="form-container">
    <p class="eyebrow">Client Access</p>
    <h1>Discover luxury beauty & wellness services near you.</h1>

    <div class="form-note">Join the early client list and help shape luxury beauty discovery.</div>
<form class="luxury-form">
      <input type="text" placeholder="Full Name">
      <input type="email" placeholder="Email Address">

      <select>
        <option>Choose Country</option>
        <option>Canada</option>
        <option>United States</option>
        <option>France</option>
        <option>United Kingdom</option>
      </select>

      <select>
        <option>Choose Province / State</option>
        <option>Québec</option>
        <option>Ontario</option>
        <option>British Columbia</option>
      </select>

      <select>
        <option>Choose City</option>
        <option>Montréal</option>
        <option>Laval</option>
        <option>Toronto</option>
      </select>

      <select>
        <option>Service Looking For</option>
        <option>Hair Salon</option>
        <option>Nail Studio</option>
        <option>Massage Therapy</option>
        <option>Head Spa</option>
        <option>Med Spa</option>
      </select>

      <button type="submit">Join Client Waitlist</button>
    </form>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form");
  if (!form) return;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const full_name = form.querySelectorAll("input")[0]?.value || "";
    const email = form.querySelector('input[type="email"]')?.value || "";

    const { error } = await supabaseClient
      .from("clients")
      .insert([{
        full_name,
        email
      }]);

    if (error) {
      alert("Error submitting client form.");
      console.error(error);
      return;
    }

    alert("Client signup submitted successfully.");
    form.reset();
  });
});
</script>

</body>
</html>
