<!DOCTYPE html>
<html>
<head>
  <title>Voice Settings | Mortéa</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <h1>Voice Concierge Settings</h1>

  <form>
    <label>
      <input type="checkbox" checked>
      Enable Voice Concierge
    </label>

    <label>
      <input type="checkbox" checked>
      Enable Voice Search
    </label>

    <label>
      <input type="checkbox">
      Enable Audio Notifications
    </label>

    <button type="submit">Save Settings</button>
  </form>
</body>
</html>
