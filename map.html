<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Find beauty professionals, clinics, and wellness experts near you on Mortéa's live discovery map.">
  <title>Map Discovery — Mortéa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
  <style>
    .map-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; height: calc(100vh - 64px); overflow: hidden; }
    .map-sidebar { overflow-y: auto; padding: 20px; border-right: 1px solid var(--line); background: rgba(7,5,4,.92); }
    .map-sidebar::-webkit-scrollbar { width: 4px; }
    .map-sidebar::-webkit-scrollbar-thumb { background: rgba(234,214,198,.15); border-radius: 99px; }
    #googleMap { width: 100%; height: 100%; background: #0e0a07; }
    .map-search-box { display: grid; gap: 8px; margin-bottom: 14px; }
    .map-filter-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
    .map-chip { border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: var(--champagne); padding: 6px 12px; font-size: 12px; cursor: pointer; transition: all .18s; white-space: nowrap; }
    .map-chip:hover, .map-chip.active { background: rgba(234,214,198,.12); border-color: var(--line-hi); color: var(--sand); }
    .map-provider-card { border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: rgba(255,255,255,.04); margin-bottom: 10px; cursor: pointer; transition: all .18s; }
    .map-provider-card:hover { border-color: var(--line-hi); background: rgba(255,255,255,.07); }
    .map-provider-card.selected { border-color: rgba(217,183,162,.45); background: rgba(217,183,162,.08); }
    .map-provider-topline { font-size: 11px; color: var(--rose); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 4px; font-weight: 700; }
    .map-provider-card h3 { font-size: 15px; margin: 0 0 3px; font-weight: 600; }
    .map-provider-card p { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    .map-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .map-card-actions a { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--champagne); transition: all .15s; }
    .map-card-actions a:hover { background: rgba(234,214,198,.10); border-color: var(--line-hi); }
    .map-provider-thumb { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(140deg,#d9b7a2,#3e2218); flex-shrink: 0; overflow: hidden; }
    .map-provider-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .result-count-bar { font-size: 12px; color: var(--rose); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .location-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: var(--champagne); padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all .18s; width: 100%; justify-content: center; margin-bottom: 10px; }
    .location-btn:hover { background: rgba(255,255,255,.08); border-color: var(--line-hi); }
    @media(max-width:800px){
      .map-layout { grid-template-columns: 1fr; height: auto; }
      #googleMap { height: 320px; }
      .map-sidebar { max-height: 60vh; }
    }
  </style>
</head>
<body class="mortea-luxury" style="overflow:hidden">

<nav class="nav" style="height:64px">
  <a class="brand" href="index.html">Mortéa</a>
  <div class="nav-links">
    <a href="discover.html">Discover</a>
    <a href="map.html" style="color:var(--sand);font-weight:700">Map</a>
    <a href="professional-onboarding.html">Professionals</a>
    <a href="login.html">Access</a>
    <a class="lang" href="fr/index.html">FR</a>
  </div>
</nav>

<div class="map-layout">
  <!-- Sidebar -->
  <aside class="map-sidebar">
    <div class="map-search-box">
      <input class="input" id="serviceSearch" placeholder="Botox, lashes, facial..." style="font-size:13px">
      <input class="input" id="citySearch" placeholder="City or country..." style="font-size:13px">
      <button class="btn primary" id="mapSearchButton" style="padding:11px">Search</button>
    </div>

    <button class="location-btn" id="useLocationButton">
      <span>📍</span> Use my location
    </button>
    <div id="locationStatus" style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;min-height:16px"></div>

    <div class="map-filter-chips">
      <button class="map-chip" data-map-filter="Botox">Botox</button>
      <button class="map-chip" data-map-filter="Laser">Laser</button>
      <button class="map-chip" data-map-filter="Med Spa">Med Spa</button>
      <button class="map-chip" data-map-filter="Head Spa">Head Spa</button>
      <button class="map-chip" data-map-filter="Lash">Lashes</button>
      <button class="map-chip" data-map-filter="Nail">Nails</button>
      <button class="map-chip" data-map-filter="Facial">Facial</button>
      <button class="map-chip" data-map-filter="Massage">Massage</button>
    </div>

    <div class="result-count-bar" id="resultCount">Loading…</div>
    <div id="mapResults"></div>
  </aside>

  <!-- Map canvas — loads immediately with hardcoded key -->
  <div id="googleMap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="map-foundation.js"></script>

<!-- Load Google Maps directly with hardcoded key — no config dependency -->
<script>
(function() {
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCBoCytiF2MhVT585EALvA3J70KoR8MQ88&callback=initGoogleMap&libraries=places';
  s.async = true;
  s.defer = true;
  s.onerror = function() {
    document.getElementById('googleMap').innerHTML =
      '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--muted);padding:40px;text-align:center">' +
      '<div style="font-size:48px">🗺</div>' +
      '<p style="font-size:15px;max-width:300px">Map unavailable. Check that the Maps JavaScript API is enabled in Google Cloud Console.</p>' +
      '<a class="btn secondary" href="discover.html">Use list discovery instead</a></div>';
  };
  document.head.appendChild(s);
})();

let map, markers = [];

function initGoogleMap() {
  map = new google.maps.Map(document.getElementById('googleMap'), {
    zoom: 5,
    center: { lat: 45.5017, lng: -73.5673 },
    styles: [
      { elementType: 'geometry', stylers: [{ color: '#0e0a07' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#d9b7a2' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#070504' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#271310' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#130d0a' }] },
      { featureType: 'poi', stylers: [{ visibility: 'off' }] },
      { featureType: 'transit', stylers: [{ visibility: 'off' }] }
    ]
  });
}

// Override renderProviders to drop map markers
const _origRender = window.renderProviders;
window.renderProviders = function(list) {
  if (_origRender) _origRender(list);
  if (!map) return;
  markers.forEach(m => m.setMap(null));
  markers = [];
  list.forEach(p => {
    if (!p.latitude || !p.longitude) return;
    const marker = new google.maps.Marker({
      position: { lat: parseFloat(p.latitude), lng: parseFloat(p.longitude) },
      map,
      title: p.business_name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9,
        fillColor: '#ead6c6',
        fillOpacity: 1,
        strokeColor: '#070504',
        strokeWeight: 2
      }
    });
    const iw = new google.maps.InfoWindow({
      content: `<div style="font-family:Inter,sans-serif;padding:6px 4px">
        <strong style="font-size:14px">${p.business_name}</strong>
        <br><span style="font-size:12px;color:#666">${p.category||''}</span>
        <br><a href="provider.html?id=${p.id}" style="font-size:12px;color:#d9b7a2">View profile →</a>
      </div>`
    });
    marker.addListener('click', () => {
      iw.open(map, marker);
      document.getElementById('card-' + p.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    markers.push(marker);
  });
  if (markers.length) {
    const bounds = new google.maps.LatLngBounds();
    markers.forEach(m => bounds.extend(m.getPosition()));
    map.fitBounds(bounds);
  }
};
</script>
</body>
</html>
