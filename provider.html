<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Luxury beauty professional profile on Mortéa.">
  <title>Provider Profile — Mortéa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-hero { display:grid; grid-template-columns:160px 1fr; gap:28px; align-items:start; padding:60px 6vw 32px; }
    .profile-avatar { width:160px; height:160px; border-radius:28px; background:linear-gradient(140deg,#d9b7a2,#3e2218); border:1px solid var(--line); overflow:hidden; flex-shrink:0; }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-name { font-family:'Playfair Display',serif; font-size:clamp(36px,5vw,62px); margin:0 0 8px; line-height:.95; }
    .profile-cat  { color:var(--rose); font-size:14px; text-transform:uppercase; letter-spacing:.16em; font-weight:700; }
    .profile-loc  { color:var(--muted); font-size:15px; margin-top:6px; }
    .profile-ctas { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .profile-body { display:grid; grid-template-columns:1fr 320px; gap:24px; padding:0 6vw 60px; align-items:start; }
    .profile-main > h2 { font-family:'Playfair Display',serif; font-size:28px; margin:28px 0 12px; }
    .services-grid { display:flex; gap:8px; flex-wrap:wrap; }
    .service-tag  { border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; color:var(--champagne); }
    .social-links { display:grid; gap:10px; }
    .social-link  { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:18px; padding:13px 16px; background:rgba(255,255,255,.04); transition:all .18s; color:var(--sand); font-weight:600; font-size:14px; }
    .social-link:hover { border-color:var(--line-hi); background:rgba(255,255,255,.08); transform:translateY(-1px); }
    .social-link .icon { font-size:20px; width:26px; text-align:center; }
    .review-card  { border:1px solid var(--line); border-radius:18px; padding:18px; background:rgba(255,255,255,.04); margin-bottom:12px; }
    .review-stars { color:var(--champagne); font-size:16px; }
    .stat-mini    { display:flex; gap:24px; flex-wrap:wrap; margin-top:10px; }
    .stat-mini span { font-size:13px; color:var(--muted); }
    .stat-mini strong { color:var(--sand); }
    @media(max-width:800px){ .profile-hero{grid-template-columns:1fr;} .profile-avatar{width:100px;height:100px;border-radius:22px;} .profile-body{grid-template-columns:1fr;} }
  </style>
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="mortea-luxury">
<nav class="nav">
  <a class="brand" href="index.html">Mortéa</a>
  <div class="nav-links">
    <a href="discover.html">Discover</a>
    <a href="map.html">Map</a>
    <a href="login.html">Access</a>
  </div>
</nav>

<div id="profileLoading" style="text-align:center;padding:80px;color:var(--muted)">Loading profile…</div>
<div id="profileContent" style="display:none">
  <div class="profile-hero">
    <div class="profile-avatar" id="avatarWrap">
      <img loading="lazy" id="profilePhoto" src="" alt="" style="display:none">
    </div>
    <div>
      <div class="profile-cat" id="profileCategory"></div>
      <h1 class="profile-name" id="profileName"></h1>
      <div class="profile-loc" id="profileLocation"></div>
      <div class="stat-mini">
        <span><strong id="profileRating">—</strong> avg rating</span>
        <span><strong id="profileReviewCount">0</strong> reviews</span>
        <span><strong id="profileViews">0</strong> views</span>
      </div>
      <div class="profile-ctas" id="profileCtas"></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <a class="btn primary" id="btnBook" href="#" style="font-size:14px;display:none">📅 Request booking</a>
      <button class="btn secondary" id="btnFav" onclick="toggleFav()" style="font-size:14px">♡ Save</button>
    </div>
    </div>
  </div>

  <div class="profile-body">
    <div class="profile-main">
      <div id="profileAboutSection" style="display:none">
        <h2>About</h2>
        <p id="profileBio" style="color:#d4c4b8;font-size:16px;line-height:1.75"></p>
      </div>

      <div id="profileServicesSection" style="display:none">
        <h2>Services</h2>
        <div class="services-grid" id="profileServices"></div>
      </div>

      <div id="profileReviewsSection">
        <h2>Reviews</h2>
        <div id="profileReviews">
          <div style="color:var(--muted);font-size:14px">No reviews yet.</div>
        </div>
        <a class="btn secondary" href="reviews.html" style="margin-top:16px;display:inline-flex">Leave a review</a>
      </div>
    </div>

    <aside>
      <div class="card" style="margin-bottom:16px">
        <div class="eyebrow" style="margin-bottom:14px">Connect</div>
        <div class="social-links" id="socialLinks"></div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">Location</div>
        <p id="profileAddress" style="color:var(--muted);font-size:14px;line-height:1.65"></p>
      </div>
    </aside>
  </div>
</div>
<div id="profileNotFound" style="display:none;text-align:center;padding:80px">
  <h2 style="font-family:'Playfair Display',serif;font-size:36px;margin-bottom:12px">Profile not found</h2>
  <p style="color:var(--muted);margin-bottom:24px">This profile couldn't be loaded.</p>
  <a class="btn primary" href="discover.html">Back to Discover</a>
</div>

<footer class="footer"><b>Mortéa</b><span>Luxury beauty profile.</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="provider-dynamic.js"></script>
</body>
</html>
