name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/Mortea.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Mortea.xcarchive/Products/Applications/Mortéa.app build/Payload/ 2>/dev/null || \
          cp -R build/Mortea.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r Mortea-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mortea-ios-ipa
          path: build/Mortea-unsigned.ipa
          retention-days: 30
